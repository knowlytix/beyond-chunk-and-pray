[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundloop"
version = "0.1.0"
description = "Trustworthy RAG with geometric memory — grounded, cited, byte-exact, abstaining. GMS-optional."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Knowlytix" }]
keywords = ["rag", "retrieval", "grounding", "provenance", "knowledge-graph", "hallucination", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "transformers>=4.40", "scikit-learn"]
gms = ["knowlytix"]              # licensed, installed separately — see README
notebooks = ["jupyterlab", "matplotlib", "pandas"]
dev = ["pytest", "ruff", "black"]
all = ["groundloop[ml,notebooks]"]

[project.urls]
Homepage = "https://github.com/knowlytix/beyond-chunk-and-pray"
Repository = "https://github.com/knowlytix/beyond-chunk-and-pray"
Issues = "https://github.com/knowlytix/beyond-chunk-and-pray/issues"
GMS = "https://knowlytix.ai/"

[tool.setuptools.packages.find]
include = ["groundloop*"]
